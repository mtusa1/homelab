<!-- HOMELAND GLOBAL OVERVIEW -->
<section class="global-overview" aria-labelledby="global-overview-title">
    <div class="overview-heading">
        <div>
            <p class="eyebrow">Command center</p>
            <h2 id="global-overview-title">Global Overview</h2>
        </div>

        <div id="overview-health" class="overview-health loading">
            <span class="overview-health-dot"></span>

            <div>
                <span>Overall health</span>
                <strong id="overview-health-text">Checking…</strong>
            </div>
        </div>
    </div>

    <div class="overview-stat-grid">
        <article class="overview-stat">
            <span class="overview-stat-label">Devices</span>
            <strong id="overview-devices" class="overview-stat-value">
                — / — online
            </strong>
            <span
                id="overview-devices-caption"
                class="overview-stat-caption"
            >
                Checking monitored systems
            </span>
        </article>

        <article class="overview-stat">
            <span class="overview-stat-label">Docker</span>
            <strong id="overview-docker" class="overview-stat-value">
                —
            </strong>
            <span
                id="overview-docker-caption"
                class="overview-stat-caption"
            >
                Ubuntu NUC
            </span>
        </article>

        <article class="overview-stat">
            <span class="overview-stat-label">
                Monitored storage
            </span>
            <strong id="overview-storage" class="overview-stat-value">
                —
            </strong>
            <span
                id="overview-storage-caption"
                class="overview-stat-caption"
            >
                Discovering volumes
            </span>
        </article>

        <article class="overview-stat">
            <span class="overview-stat-label">Average CPU</span>
            <strong id="overview-cpu" class="overview-stat-value">
                —
            </strong>

            <div class="progress-track overview-progress">
                <div
                    id="overview-cpu-bar"
                    class="progress-bar"
                    style="width: 0%"
                ></div>
            </div>

            <span
                id="overview-cpu-caption"
                class="overview-stat-caption"
            >
                Across online computers
            </span>
        </article>
    </div>

    <div class="overview-alerts">
        <div class="overview-alerts-heading">
            <div>
                <span class="overview-stat-label">Alerts</span>
                <strong id="overview-alert-count">Checking…</strong>
            </div>

            <span
                id="overview-refresh-status"
                class="overview-refresh-status"
            >
                Loading live metrics
            </span>
        </div>

        <div
            id="overview-alert-list"
            class="overview-alert-list"
            aria-live="polite"
        >
            <div class="overview-alert neutral">
                Gathering device health information…
            </div>
        </div>
    </div>
</section>
