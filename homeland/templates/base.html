<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}Homeland{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/homeland.css') }}"
    >
</head>

<body>
    <header class="site-header">
        <a class="brand" href="/">
            <span class="brand-mark">H</span>

            <span>
                <strong>Homeland</strong>
                <small>Infrastructure Control</small>
            </span>
        </a>

        <div class="header-status">
            <span class="status-dot healthy"></span>
            <span>Monitoring active</span>
        </div>
    </header>

    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        Homeland · Homelab monitoring
    </footer>

    <script
        src="{{ url_for('static', filename='js/common.js') }}"
    ></script>
    {% block scripts %}{% endblock %}
</body>
</html>
