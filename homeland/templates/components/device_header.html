<section class="device-header">

    <div class="device-title">
        <h1>{{ device_name }}</h1>
        <p>{{ device_description }}</p>
    </div>

    <div class="device-status">

        <span
            id="device-status-dot"
            class="status-dot loading"
        ></span>

        <span id="device-status-text">
            Loading...
        </span>

    </div>

</section>
