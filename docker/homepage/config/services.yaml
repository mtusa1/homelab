- Operations:
    - Nightly Backup:
        icon: mdi-backup-restore
        description: Docker and homelab recovery backup
        widget:
          type: customapi
          url: http://192.168.5.134:8090/status.json
          refreshInterval: 60000
          mappings:
            - field: status
              label: Status
              format: text
            - field: completed
              label: Completed
              format: text
            - field: duration
              label: Duration
              format: text
            - field: size
              label: Size
              format: text

