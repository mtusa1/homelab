- Media:
    - Immich:
        icon: immich.png
        href: http://192.168.5.134:2283
        description: Photos and mobile backup
        siteMonitor: http://192.168.5.134:2283
        server: local-docker
        container: immich_server
        widget:
          type: immich
          url: http://192.168.5.134:2283
          key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
          version: 2
          fields:
            - users
            - photos
            - videos
            - storage

    - Jellyfin:
        icon: jellyfin.png
        href: http://192.168.5.134:8096
        description: Movies, television, and music
        siteMonitor: http://192.168.5.134:8096
        server: local-docker
        container: jellyfin
        widget:
          type: jellyfin
          url: http://192.168.5.134:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true
          enableNowPlaying: true
          showEpisodeNumber: true

    - Kavita:
        icon: kavita.png
        href: http://192.168.5.134:5000
        description: Books, comics, and magazines
        siteMonitor: http://192.168.5.134:5000
        server: local-docker
        container: kavita
        widget:
          type: kavita
          url: http://192.168.5.134:5000
          username: "{{HOMEPAGE_VAR_KAVITA_USERNAME}}"
          password: "{{HOMEPAGE_VAR_KAVITA_PASSWORD}}"
          fields:
            - seriesCount
            - totalFiles

